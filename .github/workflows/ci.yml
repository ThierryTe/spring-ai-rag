name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          POSTGRES_DB_NAME: airagdb
          POSTGRES_USER_NAME: airaguser
          POSTGRES_PASSWORD: test-password
          APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
        run: mvn -B verify

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B sonar:sonar -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"

  # Golden dataset RAG contre un vrai modele OpenAI (cout reel, pas mocke) : necessite le secret
  # OPENAI_EVAL_API_KEY ; job ignore si ce secret n'est pas configure sur le repo.
  rag-eval:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ secrets.OPENAI_EVAL_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run RAG golden dataset evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_EVAL_API_KEY }}
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          POSTGRES_DB_NAME: airagdb
          POSTGRES_USER_NAME: airaguser
          POSTGRES_PASSWORD: test-password
          APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
        run: mvn -B test -Dgroups=eval -DexcludedGroups=
