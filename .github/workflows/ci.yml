
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Java Tests & SonarQube Quality Gate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          POSTGRES_DB_NAME: airagdb
          POSTGRES_USER_NAME: airaguser
          POSTGRES_PASSWORD: test-password
          APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
        run: mvn -B verify

      - name: SonarQube Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::SonarQube configuration missing"
            exit 1
          fi

          mvn -B sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

  rag-eval:
    name: RAG Golden Dataset Evaluation
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Require OpenAI evaluation key
        env:
          OPENAI_EVAL_API_KEY: ${{ secrets.OPENAI_EVAL_API_KEY }}
        run: |
          if [ -z "$OPENAI_EVAL_API_KEY" ]; then
            echo "::error::OPENAI_EVAL_API_KEY is missing"
            exit 1
          fi

      - name: Run RAG golden dataset evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_EVAL_API_KEY }}
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          POSTGRES_DB_NAME: airagdb
          POSTGRES_USER_NAME: airaguser
          POSTGRES_PASSWORD: test-password
          APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
        run: mvn -B test -Dgroups=eval -DexcludedGroups=

      - name: Verify golden dataset tests executed
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("target/surefire-reports/TEST-*.xml")
          executed = 0

          for report in reports:
              root = ET.parse(report).getroot()

              suites = (
                  [root] if root.tag == "testsuite"
                  else root.findall(".//testsuite")
              )

              for suite in suites:
                  tests = int(suite.get("tests", 0))
                  skipped = int(suite.get("skipped", 0))
                  failures = int(suite.get("failures", 0))
                  errors = int(suite.get("errors", 0))

                  if failures or errors:
                      print("::error::RAG tests failed")
                      sys.exit(1)

                  executed += max(0, tests - skipped)

          print(f"Executed RAG tests: {executed}")

          if executed == 0:
              print("::error::No RAG evaluation test executed")
              sys.exit(1)

          print("RAG evaluation passed")
          PY

      - name: Upload RAG evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  quality-gate:
    name: GenAI Production Quality Gate
    runs-on: ubuntu-latest
    needs:
      - test
      - rag-eval

    steps:
      - name: Validate quality gates
        run: |
          echo "Java tests: PASS"
          echo "SonarQube Quality Gate: PASS"
          echo "RAG Golden Dataset: PASS"
          echo "GenAI Production Quality Gate: PASS"
