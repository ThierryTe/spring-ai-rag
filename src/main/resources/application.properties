spring.application.name=enterprise-ai-knowledge-assistant

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.com.tewendelabs.airag=INFO


spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.timeout=30s
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.max-tokens=1024
spring.ai.openai.chat.temperature=0.2
spring.ai.openai.embedding.model=text-embedding-3-small


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB_NAME}
spring.datasource.username=${POSTGRES_USER_NAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=480

demo.session.max-questions=5
demo.session.max-documents=2
demo.session.ttl-hours=2
demo.session.max-session-creations-per-ip-per-hour=10

ingestion.max-file-size-mb=20
ingestion.max-pages=200
ingestion.allowed-content-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain
ingestion.chunking.chunk-size=1000
ingestion.chunking.chunk-overlap=150

# Legerement au-dessus de ingestion.max-file-size-mb : c'est FileValidationService qui doit
# produire l'erreur 400 propre dans le cas normal, cette limite Spring n'est qu'un filet de
# securite pour ne pas laisser un upload demesure saturer la memoire avant meme la validation.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

rag.retrieval.top-k=5
rag.retrieval.min-similarity=0.5
rag.retrieval.daily-question-quota-per-user=20

# Tarification gpt-4o-mini (USD / 1000 tokens) - approximation pour le suivi de cout/dashboard,
# pas un chiffre de facturation exact (voir RagCostProperties).
rag.cost.prompt-per-1k-tokens-usd=0.00015
rag.cost.completion-per-1k-tokens-usd=0.0006

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=when-authorized

